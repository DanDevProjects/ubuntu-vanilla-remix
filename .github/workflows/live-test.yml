name: Interactive Live Browser Desktop

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow Run ID from your green-checkmark ISO build'
        required: true

jobs:
  live-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO from Build Run
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-vanilla-remix-stonking
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QEMU, noVNC, xorriso, and Cloudflare Tunnel
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 novnc websockify curl xorriso
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Extract Kernel and Boot Live Desktop Directly
        run: |
          ISO_FILE=$(find . -name "*.iso" | head -n 1)
          mkdir -p iso_extract
          xorriso -osirrox on -indev "$ISO_FILE" -extract / iso_extract
          VMLINUZ=$(find iso_extract -name "vmlinuz*" | head -n 1)
          INITRD=$(find iso_extract -name "initrd*" | head -n 1)
          echo "Booting kernel: $VMLINUZ with initrd: $INITRD"
          qemu-system-x86_64 \
            -m 4096 \
            -smp 2 \
            -usb -device usb-tablet \
            -kernel "$VMLINUZ" \
            -initrd "$INITRD" \
            -append "boot=casper quiet splash ---" \
            -cdrom "$ISO_FILE" \
            -vnc :0 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 10
          echo "=========================================="
          echo "CLICK THIS LINK TO USE YOUR OS IN BROWSER:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="
          sleep 1500
