name: Build Ubuntu Vanilla Remix ISO

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Ubuntu Release Codename (e.g. noble, resolute)'
        required: true
        default: 'resolute'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap

      - name: Configure live-build
        run: |
          mkdir -p build
          cp -r config build/
          cd build
          lb config \
            --distribution ${{ github.event.inputs.release }} \
            --architecture amd64 \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu/ \
            --mirror-binary http://archive.ubuntu.com/ubuntu/ \
            --debian-installer none \
            --iso-application "Ubuntu Vanilla Remix" \
            --iso-volume "Ubuntu Vanilla Remix"

      - name: Build the ISO
        run: |
          cd build
          sudo lb build

      - name: Save private test ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-vanilla-remix-${{ github.event.inputs.release }}
          path: build/*.iso
          retention-days: 7
